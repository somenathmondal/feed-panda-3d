<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feed Panda</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐼</text></svg>">
  
  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://feed-panda.vercel.app/">
  <meta property="og:title" content="Feed Panda">
  <meta property="og:description" content="An interactive 3D experience. Master your inner peace and feed the panda some dumplings.">
  <meta property="og:image" content="https://feed-panda.vercel.app/assets/yeti.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://feed-panda.vercel.app/">
  <meta property="twitter:title" content="Feed Panda">
  <meta property="twitter:description" content="An interactive 3D experience. Master your inner peace and feed the panda some dumplings.">
  <meta property="twitter:image" content="https://feed-panda.vercel.app/assets/yeti.png">

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Go3v2';
      src: url('assets/go3v2.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div class="loader-overlay" id="loaderOverlay">
    <div class="loader-content">
      <div class="panda-face">
        <div class="panda-ear panda-ear-left"></div>
        <div class="panda-ear panda-ear-right"></div>
        <div class="panda-head">
          <div class="panda-eye panda-eye-left">
            <div class="panda-pupil"></div>
          </div>
          <div class="panda-eye panda-eye-right">
            <div class="panda-pupil"></div>
          </div>
          <div class="panda-nose"></div>
          <div class="panda-mouth"></div>
        </div>
      </div>
      <div class="loader-bar-wrapper">
        <div class="loader-bar" id="loaderBar"></div>
      </div>
      <div class="loader-text" id="loaderText">Loading... 0%</div>
      <div class="loader-subtitle">Preparing dumplings...</div>
    </div>
  </div>

  <!-- Toast hint -->
  <div class="toast" id="toast"></div>

  <div class="fullscreen-scene" id="scenePanel">
    <canvas id="threeCanvas"></canvas>
  </div>

  <!-- Three.js via ES Module -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="scene.js"></script>
  
  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>

  <!-- Protection Script -->
  <script>
    // Disable right-click
    document.addEventListener('contextmenu', e => e.preventDefault());

    // Disable keyboard shortcuts for devtools
    document.addEventListener('keydown', e => {
      if (
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
        (e.ctrlKey && e.key === 'U') ||
        (e.metaKey && e.altKey && e.key === 'i') || // Mac
        (e.metaKey && e.key === 'u')               // Mac
      ) {
        e.preventDefault();
        return false;
      }
    });

    // Detect and deter debugging (skip for bots to allow Vercel screenshots)
    (function() {
      const isBot = /bot|googlebot|crawler|spider|robot|crawling|vercel/i.test(navigator.userAgent);
      if (isBot) return;

      const deter = function() {
        setInterval(function() {
          debugger;
        }, 100);
      };
      // Only runs if they actually manage to open devtools
      try { deter(); } catch (e) {}
    })();
  </script>
</body>
</html>
