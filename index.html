<head>

  <title>Feed Panda</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐼</text></svg>">
  
  <!-- Open Graph / Social Media -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://feed-panda.vercel.app/">
  <meta property="og:title" content="Feed Panda">
  <meta property="og:description" content="An interactive 3D experience. Master your inner peace and feed the panda some dumplings.">
  <meta property="og:image" content="https://feed-panda.vercel.app/assets/yeti.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://feed-panda.vercel.app/">
  <meta property="twitter:title" content="Feed Panda">
  <meta property="twitter:description" content="An interactive 3D experience. Master your inner peace and feed the panda some dumplings.">
  <meta property="twitter:image" content="https://feed-panda.vercel.app/assets/yeti.png">

  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Go3v2';
      src: url('assets/go3v2.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div class="loader-overlay" id="loaderOverlay">
    <div class="loader-content">
      <div class="panda-face">
        <div class="panda-ear panda-ear-left"></div>
        <div class="panda-ear panda-ear-right"></div>
        <div class="panda-head">
          <div class="panda-eye panda-eye-left">
            <div class="panda-pupil"></div>
          </div>
          <div class="panda-eye panda-eye-right">
            <div class="panda-pupil"></div>
          </div>
          <div class="panda-nose"></div>
          <div class="panda-mouth"></div>
        </div>
      </div>
      <div class="yinyang-wrapper" id="yinyangWrapper" style="--progress: 0%; --progress-num: 0;">
        <div class="yinyang-mask">
          <svg viewBox="0 0 100 100" class="yinyang-svg" id="yinyangSymbol">
            <defs>
              <filter id="yinyangGlow" x="-20%" y="-20%" width="140%" height="140%">
                <feGaussianBlur stdDeviation="1.5" result="blur" />
                <feMerge>
                  <feMergeNode in="blur" />
                  <feMergeNode in="SourceGraphic" />
                </feMerge>
              </filter>
            </defs>
            <!-- White base (left side) -->
            <path d="M 50,1 A 24.5,24.5 0 0,1 50,50 A 24.5,24.5 0 0,0 50,99 A 49,49 0 0,0 50,1 Z" fill="#ffffff" class="yinyang-base-white" />
            <!-- Black base (right side) -->
            <path d="M 50,1 A 24.5,24.5 0 0,1 50,50 A 24.5,24.5 0 0,0 50,99 A 49,49 0 0,1 50,1 Z" fill="#1e0e0e" class="yinyang-base-black" />
            
            <!-- Small dots -->
            <circle cx="50" cy="25.5" r="7.5" fill="#1e0e0e" class="yinyang-base-white" />
            <circle cx="50" cy="74.5" r="7.5" fill="#ffffff" class="yinyang-base-black" />

            <!-- Faint tracing guide lines -->
            <circle cx="50" cy="50" r="49" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />
            <path d="M 50,1 A 24.5,24.5 0 0,1 50,50 A 24.5,24.5 0 0,0 50,99" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" />

            <!-- Glowing active tracing lines -->
            <circle cx="50" cy="50" r="49" fill="none" stroke="#ffffff" stroke-width="2" pathLength="100" class="trace-circle" filter="url(#yinyangGlow)" />
            <path d="M 50,1 A 24.5,24.5 0 0,1 50,50 A 24.5,24.5 0 0,0 50,99" fill="none" stroke="#ffffff" stroke-width="2" pathLength="100" class="trace-scurve" filter="url(#yinyangGlow)" />
          </svg>
        </div>
      </div>
      <div class="loader-text" id="loaderText">Loading... 0%</div>
      <div class="loader-subtitle">Preparing dumplings...</div>
    </div>
  </div>

  <!-- Toast hint -->
  <div class="toast" id="toast"></div>

  <!-- Credits UI -->
  <div class="credits-container">
    <a href="https://sketchfab.com/3d-models/po-from-kung-fu-panda-rigged-bef71a2b1dbd4a449c639fdf1776db7b" target="_blank" class="credit-link">Po 3D Model</a>
    <a href="https://www.linkedin.com/in/somenath-mondal-xr-tech/" target="_blank" class="credit-link">Contact Developer</a>
  </div>

  <div class="fullscreen-scene" id="scenePanel">
    <canvas id="threeCanvas"></canvas>
  </div>

  <!-- Three.js via ES Module -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.167.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.167.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="scene.js"></script>
  
  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>

</body>
</html>
